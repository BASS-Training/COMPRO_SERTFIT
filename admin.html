<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin | LSP FIT</title>
  <link rel="icon" type="image/png" href="/assets/lspfit/favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/redesign.css?v=20260622-admin-navy-member-card" />
</head>
<body>
  <header class="site-header scrolled admin-site-header" id="siteHeader">
    <div class="header-inner">
      <a class="logo-link" href="/index.html" aria-label="LSP FIT Beranda">
        <img src="/assets/lspfit/logofit-nobg.png" alt="Logo LSP FIT" />
      </a>
      <nav class="main-nav" id="mainNav" aria-label="Navigasi utama">
        <ul>
          <li><a href="/index.html">Beranda</a></li>
          <li><a href="/kegiatan.html">Skema Sertifikasi</a></li>
          <li><a class="active" href="/admin.html">Admin</a></li>
        </ul>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="Buka menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="page-bg admin-page">
    <section class="page-hero admin-hero">
      <div class="container">
        <p class="breadcrumb">Beranda / Admin</p>
        <h1>Login Admin</h1>
        <p>Masuk untuk mengelola konten website LSP FIT.</p>
      </div>
    </section>

    <section class="section admin-login-section">
      <div class="container admin-login-layout">
        <article class="card admin-card admin-login-card">
          <p class="section-kicker">Area Terproteksi</p>
          <h2>Masuk ke Dashboard</h2>
          <p class="admin-note">Gunakan akun super admin yang telah dikonfigurasi di database lokal/server.</p>
          <form class="admin-form" id="loginForm">
            <label for="adminUsername">Username</label>
            <input id="adminUsername" name="username" type="text" autocomplete="username" required />

            <label for="adminPassword">Password</label>
            <input id="adminPassword" name="password" type="password" autocomplete="current-password" required />

            <button class="btn btn-primary" type="submit">Masuk ke Dashboard</button>
            <p class="admin-message" id="adminMessage" aria-live="polite"></p>
          </form>
        </article>
      </div>
    </section>
  </main>

  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/admin-login.js?v=20260924-separated-admin"></script>
</body>
</html>
